name: CD - Build and Push Frontend Image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.*'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Normalize owner to lowercase for GHCR
        id: owner
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_OWNER=${OWNER_LC}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push HomeChat
        uses: docker/build-push-action@v5
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/homechat:latest
