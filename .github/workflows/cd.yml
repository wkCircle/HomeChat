name: CD - Build and Push Frontend Image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    runs-on: ubuntu-latest
    needs: ci
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.*'
              - '.github/workflows/cd.yml'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Normalize owner to lowercase for GHCR
        id: owner
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_OWNER=${OWNER_LC}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push HomeChat
        uses: docker/build-push-action@v5
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/home_chat:latest

      - name: Trigger HomeAI deployment
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEAI_DISPATCH_TOKEN }}
          HOMEAI_REPOSITORY: ${{ github.repository_owner }}/HomeAI
          CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEAI_DISPATCH_TOKEN is not configured."
            exit 1
          fi
          gh api --method POST "repos/${HOMEAI_REPOSITORY}/dispatches" \
            --field event_type=homechat-image-published \
            --field "client_payload[sha]=${GITHUB_SHA}" \
            --field "client_payload[correlation_id]=${CORRELATION_ID}"

      - name: Wait for HomeAI deployment
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEAI_DISPATCH_TOKEN }}
          HOMEAI_REPOSITORY: ${{ github.repository_owner }}/HomeAI
          RUN_TITLE: HomeChat deployment ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          RUN_ID=""
          for attempt in {1..60}; do
            RUN_ID=$(gh run list \
              --repo "$HOMEAI_REPOSITORY" \
              --workflow cd.yml \
              --event repository_dispatch \
              --limit 50 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"$RUN_TITLE\") | .databaseId" \
              | head -n 1)
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            echo "Waiting for the HomeAI deployment run to appear (attempt $attempt/60)..."
            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "Could not find HomeAI workflow run: $RUN_TITLE"
            exit 1
          fi

          echo "Watching HomeAI workflow run $RUN_ID"
          gh run watch "$RUN_ID" --repo "$HOMEAI_REPOSITORY" --exit-status
